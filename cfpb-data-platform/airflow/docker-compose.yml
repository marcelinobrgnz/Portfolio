# Local Airflow for portfolio demo — NOT for production.
# Usage (from repo root, WSL or Docker Desktop):
#   docker compose -f airflow/docker-compose.yml up -d --build
# UI: http://localhost:8080  (admin / admin)

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  image: cfpb-airflow:2.9.3
  env_file:
    - ../.env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    CFPB_PROJECT_ROOT: /opt/airflow/cfpb-data-platform
    CFPB_MODE: full
    CFPB_SKIP_INGEST: ${CFPB_SKIP_INGEST:-1}
    SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
    SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
    SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
    SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-ACCOUNTADMIN}
    SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-CFPB_WH}
    SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-CFPB_DB}
  volumes:
    - ../:/opt/airflow/cfpb-data-platform
    - ./dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
  user: "50000:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    volumes:
      - airflow_pg:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'

  airflow-webserver:
    <<: *airflow-common
    restart: unless-stopped
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s

  airflow-scheduler:
    <<: *airflow-common
    restart: unless-stopped
    command: scheduler

volumes:
  airflow_pg:
  airflow_logs:
