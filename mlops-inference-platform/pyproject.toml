[project]
name = "mlops-inference-platform"
version = "1.0.0"
description = "End-to-end tabular MLOps: train, track, serve, test, monitor"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
