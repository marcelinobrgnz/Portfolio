<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>wine_feature_pipeline — Graph</title>
  <script src="https://cdn.jsdelivr.net/npm/viz.js@2.1.2/viz.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/viz.js@2.1.2/full.render.js"></script>
  <style>
    body { margin: 0; background: #f5f5f5; font-family: system-ui, sans-serif; }
    header {
      background: #017cee; color: #fff; padding: 12px 20px;
      font-size: 18px; font-weight: 600;
    }
    #graph { padding: 24px; overflow: auto; min-height: 400px; }
    .meta { padding: 0 20px 12px; color: #555; font-size: 14px; }
  </style>
</head>
<body>
  <header>wine_feature_pipeline — DAG Graph (local Airflow)</header>
  <p class="meta">Schedule: @weekly · Tags: spark, wine, mlops, project-1 · 5 tasks</p>
  <div id="graph"></div>
  <script>
    const dot = `digraph wine_feature_pipeline {
      graph [label=wine_feature_pipeline labelloc=t rankdir=LR]
      ingest_raw_wine [color="#000000" fillcolor="#ffefeb" label=ingest_raw_wine shape=rectangle style="filled,rounded"]
      spark_transform_wine [color="#000000" fillcolor="#ffefeb" label=spark_transform_wine shape=rectangle style="filled,rounded"]
      validate_row_counts [color="#000000" fillcolor="#ffefeb" label=validate_row_counts shape=rectangle style="filled,rounded"]
      sync_features_to_s3 [color="#000000" fillcolor="#ffefeb" label=sync_features_to_s3 shape=rectangle style="filled,rounded"]
      trigger_p1_retrain [color="#000000" fillcolor="#ffefeb" label=trigger_p1_retrain shape=rectangle style="filled,rounded"]
      ingest_raw_wine -> spark_transform_wine
      spark_transform_wine -> validate_row_counts
      validate_row_counts -> sync_features_to_s3
      sync_features_to_s3 -> trigger_p1_retrain
    }`;
    const viz = new Viz();
    viz.renderSVGElement(dot).then(el => {
      el.style.maxWidth = '100%';
      document.getElementById('graph').appendChild(el);
    });
  </script>
</body>
</html>
