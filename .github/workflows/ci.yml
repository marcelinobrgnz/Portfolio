name: Portfolio CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  p1-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mlops-inference-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mlops-inference-platform/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests monitoring
      - run: pytest tests/ -v
        env:
          PYTHONPATH: ${{ github.workspace }}/mlops-inference-platform

  p1-publish:
    runs-on: ubuntu-latest
    needs: p1-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    defaults:
      run:
        working-directory: mlops-inference-platform
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install -r requirements.txt
          MLFLOW_TRACKING_URI=sqlite:///mlflow.db python -m src.train --no-register
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: mlops-inference-platform
          target: api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/portfolio-wine-api:latest
            ghcr.io/${{ github.repository_owner }}/portfolio-wine-api:${{ github.sha }}

  p2-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spark-orchestrated-ml-pipeline
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: spark-orchestrated-ml-pipeline/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check spark_jobs tests dags
      - run: pytest tests/ -v
        env:
          PYTHONPATH: ${{ github.workspace }}/spark-orchestrated-ml-pipeline
          AIRFLOW_HOME: ${{ runner.temp }}/airflow
